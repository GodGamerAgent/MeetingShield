<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AURA-MEET | Enable Microphone Access</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #FFFDFB 0%, #FFF4EE 100%);
      color: #2B2129;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #FFD8C7;
      border-radius: 24px;
      box-shadow: 0 16px 36px -8px rgba(255, 127, 80, 0.18);
      max-width: 460px;
      width: 100%;
      padding: 36px 32px;
      text-align: center;
    }
    .orb {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF9E7D, #FF7F50);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255, 127, 80, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    .orb svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #2B2129;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #6E5D68;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #FF9E7D, #FF7F50);
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 127, 80, 0.3);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .status-msg {
      margin-top: 16px;
      font-size: 12px;
      font-weight: 600;
      color: #2B2129;
      min-height: 24px;
    }
    .success {
      color: #059669;
    }
    .error {
      color: #DC2626;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
    </div>
    <h1>Enable Microphone Access</h1>
    <p>
      Chrome requires a one-time permission grant for extension audio capture. Click <strong>Allow</strong> when prompted by the browser so AURA-MEET can capture your speech and provide live meeting intelligence.
    </p>

    <button id="grant-btn" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      </svg>
      <span>Grant Microphone Access</span>
    </button>

    <div id="status" class="status-msg"></div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
